# Genera BrilloMusical.exe en Windows (los mismos pasos que build.bat) y lo deja como artefacto descargable.
name: Build .exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: python tools\make_icon.py
      - run: pyinstaller BrilloMusical.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: BrilloMusical
          path: dist/BrilloMusical
