name: Windows EXE

on:
  push:
    paths: ["brillomusical/**", "assets/**", "tools/**", "tests/**", "run.py", "BrilloMusical.spec", "requirements.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mismos pasos que build.bat
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: python tools\make_icon.py
      - run: pyinstaller BrilloMusical.spec --noconfirm --clean
      - run: Compress-Archive -Path dist\BrilloMusical -DestinationPath BrilloMusical-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: BrilloMusical Windows ${{ github.run_number }}
          prerelease: true
          files: BrilloMusical-Windows.zip
